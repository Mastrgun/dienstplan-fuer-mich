<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dienstplan" />
    <title>Mein Dienstplan</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <input id="file-input" class="file-input" type="file" accept=".csv,text/csv,.txt,text/plain,*/*" />

    <header class="top">
      <button id="btn-prev" class="icon-btn" type="button" aria-label="Voriger Monat">‹</button>
      <div class="top-center">
        <p class="kicker" id="person-label">Jan Bitzer</p>
        <h1 id="month-title">Monat</h1>
      </div>
      <button id="btn-next" class="icon-btn" type="button" aria-label="Nächster Monat">›</button>
    </header>

    <main>
      <section id="hero" class="hero"></section>
      <p id="status" class="status" hidden></p>
      <section id="calendar" class="cal-wrap"></section>
      <section id="list" class="list-wrap"></section>
      <p id="hint" class="hint" hidden></p>
    </main>

    <nav class="dock" aria-label="Aktionen">
      <label id="btn-upload" class="dock-btn" for="file-input">CSV laden</label>
      <button id="btn-ics" type="button" class="ghost">
        <span>In den Kalender</span>
      </button>
      <button id="btn-games" type="button" class="ghost icon" aria-label="Spiele" title="Spiele">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <rect x="2" y="7" width="20" height="12" rx="6" fill="none" stroke="currentColor" stroke-width="2" />
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7 13h4M9 11v4" />
          <circle cx="16" cy="11.5" r="1" fill="currentColor" />
          <circle cx="18.5" cy="14" r="1" fill="currentColor" />
        </svg>
      </button>
      <button id="btn-reload" type="button" class="ghost icon" aria-label="Seite neu laden" title="Seite neu laden">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 12a9 9 0 1 1-3-6.7"
          />
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 3v6h-6"
          />
        </svg>
      </button>
      <button id="btn-settings" type="button" class="ghost icon" aria-label="Einstellungen">⚙</button>
    </nav>

    <dialog id="day-dialog" class="sheet">
      <div id="day-body"></div>
      <button id="btn-close-day" type="button" class="sheet-close">Schließen</button>
    </dialog>

    <dialog id="settings-dialog" class="sheet settings">
      <div id="settings-body"></div>
      <button id="btn-close-settings" type="button" class="sheet-close">Fertig</button>
    </dialog>

    <dialog id="pick-dialog" class="sheet">
      <div id="pick-body"></div>
    </dialog>

    <div id="games-overlay" class="games-overlay" hidden>
      <header class="games-top">
        <button id="games-back" class="icon-btn" type="button" aria-label="Zurück">‹</button>
        <h1 id="games-title">Spiele</h1>
        <button id="games-close" class="icon-btn" type="button" aria-label="Schließen">✕</button>
      </header>
      <div id="games-body" class="games-body"></div>
    </div>

    <script src="data.js"></script>
    <script src="games.js"></script>
    <script src="app.js"></script>
  </body>
</html>
